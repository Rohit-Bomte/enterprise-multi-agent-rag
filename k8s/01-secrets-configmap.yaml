apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: enterprise-rag
data:
  QDRANT_URL: "http://qdrant-service.enterprise-rag.svc.cluster.local:6333"
  COLLECTION_NAME: "pdf_rag"
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  GEMINI_LLM_MODEL: "gemini-3.5-flash"
  GEMINI_EMBED_MODEL: "gemini-embedding-001"
---
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: enterprise-rag
type: Opaque
stringData:
  # Replace with your actual Gemini API key before deployment
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY_HERE"

